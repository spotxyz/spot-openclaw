name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Verify clean package contents
        run: |
          rm -rf dist
          npm pack --dry-run --json > "$RUNNER_TEMP/spot-pack.json"
          test -f dist/index.js
          grep -q '"path": "dist/index.js"' "$RUNNER_TEMP/spot-pack.json"
